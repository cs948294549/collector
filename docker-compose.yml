version: '3.8'

services:
  snmp_collector:
    container_name: snmp_collector
    image: snmp_collector:v1
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-network_monitor}
    volumes:
      - ${COLLECTOR_DATA_DIR:-/root/docker_apps/snmp_collector}/logs:/app/logs
      - ${COLLECTOR_DATA_DIR:-/root/docker_apps/snmp_collector}/config/config.py:/app/config/config.py
      - ${COLLECTOR_DATA_DIR:-/root/docker_apps/snmp_collector}/config/task_config.yaml:/app/config/task_config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "-v", "grep", "|", "grep", "-q", "python.*main.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
